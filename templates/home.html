<!DOCTYPE html>
<html> 

    <head> 
            <title> Home Page </title>
            <link rel=stylesheet   href=" {{ url_for('static', filename='style.css') }}" >
            


    </head>

    <body>
        <div class = "home-body">

            <div>

                 <h1> Welcome to the home page, {{username}}</h1>


            </div>

            <div class="action-links">

                <form action="{{url_for('logout')}}" method = "POST"> 

                <button type="submit" value="logout"> LOGOUT </button>

                 </form>

                <form action="{{url_for('create_notes')}}" method = "GET"> 

                <button type="submit" value="create_notes"> ADD A NOTE </button>
                

                </form>



            </div>

            <div class = "warning" style = "align-items: center; display: flex; color: red;">
                {%block flashed_msgg%}

                        {% with messages = get_flashed_messages()%}

                            {% for msg in messages%}

                                 <p> {{msg}}</p>

                            {% endfor %}

                        {% endwith%}


                {% endblock%}


            </div>


            <div class="note-grid">
                {%if not note%}
                <p class = "notification"> Not Notes added! </p>
                {% endif %}
                {%for i in note%}
                
                <div class="note-card">

                    <div class = "note-details">
                           <h1> {{i.title}}</h1>
                            <p> {{i.description}} </p>

                    </div>

                    <div class="note-button">

                        <form action="{{url_for('edit_notes',id =i.notes_id)}}" method = "GET">
                            <button type="submit" value="edit">EDIT</button>
                        </form>

                        <form action="{{url_for('delete_notes',id =i.notes_id)}}" method = "POST">
                            <button type="submit" value="edit">DELETE</button>
                        </form>


                    </div>
                 



                </div>

                {% endfor %}

                
                

            


            </div>

           


            



            
        



        </div>

        
    </body>










</html>
